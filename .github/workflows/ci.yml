name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the runner's Docker daemon for Postgres.
      # OllamaFailureClassifierIT self-skips (no model on the runner).
      - run: mvn -B verify
