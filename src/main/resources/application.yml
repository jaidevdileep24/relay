spring:
  application:
    name: relay

  datasource:
    # reWriteBatchedInserts: the driver folds a JDBC batch into one multi-row
    # INSERT instead of N statements in one round trip.
    url: jdbc:postgresql://localhost:5433/relay?reWriteBatchedInserts=true
    username: relay
    password: relay
    hikari:
      # >= worker-threads / 2 + headroom: each send's recording transaction
      # borrows a connection briefly, and the claimer and the API need some too.
      maximum-pool-size: 30
      # Deliveries must never hold a DB connection across an HTTP call.
      # If this pool starves, that rule was broken somewhere.
      connection-timeout: 5000

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never touch it.
      ddl-auto: validate
    open-in-view: false        # avoids lazy-loading in controllers
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50       # fan-out writes N delivery rows; send them together
        order_inserts: true
        format_sql: true
    show-sql: false

  task:
    scheduling:
      pool:
        # The dispatch poll blocks until its whole batch is sent. On the default
        # single-threaded scheduler that would starve every other @Scheduled job.
        size: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true          # publishes the info.* block below at /actuator/info

# Shown at /actuator/info so the dashboard can say which classifier is live.
info:
  relay:
    ai-provider: ${relay.ai.provider}
    ollama-model: ${relay.ai.ollama-model}
    claude-model: ${relay.ai.claude-model}

logging:
  level:
    com.dileep.relay: DEBUG

# --- application-specific tuning, bound to RelayProperties ---
relay:
  dispatch:
    enabled: true            # gates DispatchScheduler, not the worker bean
    # Upper bound on one claim. drain() never claims more rows than there are
    # free worker threads, so a claimed row never queues and its lease covers
    # a single send. See docs/benchmarks.md for how these were chosen.
    batch-size: 32
    poll-interval-ms: 250    # only applies when the queue is empty
    worker-threads: 32
    http-timeout-ms: 10000   # a slow receiver is a failed receiver
  retry:
    max-attempts: 8
    base-delay-ms: 1000
    max-delay-ms: 3600000    # 1 hour cap
  signature:
    tolerance-seconds: 300   # reject replays older than 5 minutes
  rate-limit:
    enabled: true
    # Per endpoint, not global. One tenant's burst must not monopolise the
    # dispatch threads, and a small receiver handed our full throughput falls
    # over - which we would then record as *its* failure.
    permits-per-second: 50
    burst: 50              # keep >= dispatch.batch-size or every batch defers
    defer-ms: 1000         # jittered; a deferral is not a failed attempt
  ai:
    # none | ollama | claude. Default off: the dispatcher must be fully usable
    # with no model running anywhere, and the status-code heuristic still applies.
    provider: none
    ollama-base-url: http://localhost:11434
    ollama-model: llama3.2
    claude-model: claude-opus-5
    # Blank reads ANTHROPIC_API_KEY from the environment. Never commit a key.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    max-tokens: 512          # six enum values and one sentence
    timeout-ms: 10000
    max-retry-after-secs: 3600   # ceiling on a receiver-supplied Retry-After
  breaker:
    failure-threshold: 5     # 5 terminally-failed deliveries in a row trips the breaker
